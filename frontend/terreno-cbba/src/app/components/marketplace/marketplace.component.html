<section class="marketplace-section">
  <div class="container">
    <div class="galeria-decorativa">
      <div class="galeria-item"><img src="https://i.pinimg.com/1200x/9a/4e/8f/9a4e8f17b5b510a4b2891837c8f57665.jpg" alt="Terreno referencia 1" referrerpolicy="no-referrer" loading="lazy"></div>
      <div class="galeria-item"><img src="https://i.pinimg.com/1200x/3f/42/63/3f4263a47755692d72a8b996851b5470.jpg" alt="Terreno referencia 2" referrerpolicy="no-referrer" loading="lazy"></div>
      <div class="galeria-item"><img src="https://i.pinimg.com/736x/3c/1b/d2/3c1bd2b880ca82fa261789fe8cfda655.jpg" alt="Terreno referencia 3" referrerpolicy="no-referrer" loading="lazy"></div>
      <div class="galeria-item"><img src="https://i.pinimg.com/1200x/28/6a/d0/286ad0208f5f3c2800f92cb9668fbde8.jpg" alt="Terreno referencia 4" referrerpolicy="no-referrer" loading="lazy"></div>
      <div class="galeria-item"><img src="https://i.pinimg.com/1200x/4e/df/24/4edf24ac81bf22e99c4169307685bfcb.jpg" alt="Terreno referencia 5" referrerpolicy="no-referrer" loading="lazy"></div>
    </div>

    <div class="filtros-card">
      <h2>Filtros</h2>
      <div class="filtro-grupo">
        <label for="zona">Zona:</label>
        <select id="zona" [(ngModel)]="filtro_zona_id" (ngModelChange)="onFiltroCambio()">
          <option value="">Todas las zonas</option>
          <option *ngFor="let z of zonas" [value]="z.id">{{z.nombre}}</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label for="superficie">Superficie mínima (m²):</label>
        <input type="number" id="superficie" [(ngModel)]="filtro_superficie_min" (ngModelChange)="onFiltroCambio()" placeholder="0">
      </div>
      <button class="btn-primary" (click)="aplicarFiltros()">Aplicar</button>
    </div>

    <div class="lotes-grid">
      <app-lote-card *ngFor="let lote of lotes" [lote]="lote" (verDetalle)="verDetalleLote($event)"></app-lote-card>
    </div>
  </div>
</section>
